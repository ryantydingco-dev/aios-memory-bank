<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Dead Form Audit</title>
  <meta name="description" content="A tiny worksheet to see if your contact form gives sales a buyer profile - or homework.">
  <style>
    :root {
      --bg: #f7f3ec;
      --panel: #fffaf2;
      --text: #171717;
      --muted: #6b645c;
      --line: #ded6ca;
      --button: #111827;
      --button-hover: #0f766e;
      --focus: rgba(15, 118, 110, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.2;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .page {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(280px, 1fr);
      gap: 28px;
      align-items: center;
    }

    .photo {
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background:
        linear-gradient(rgba(23, 23, 23, 0.05), rgba(23, 23, 23, 0.08)),
        url("ryan-photo.jpg") center / cover no-repeat,
        linear-gradient(135deg, #d8c6aa, #efe5d4);
      box-shadow: 0 18px 60px rgba(42, 31, 18, 0.12);
    }

    .copy {
      padding: 10px 0;
    }

    .intro {
      color: var(--muted);
      font-size: 17px;
      margin: 0 0 8px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 66px);
      line-height: 0.94;
      margin: 0 0 18px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .promise {
      font-size: clamp(18px, 2.4vw, 24px);
      margin: 0 0 18px;
      max-width: 580px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 17px;
    }

    li + li {
      margin-top: 7px;
    }

    .cta-line {
      font-size: 16px;
      margin: 0 0 10px;
      font-weight: 700;
    }

    form {
      display: flex;
      gap: 8px;
      max-width: 440px;
    }

    input,
    button {
      min-height: 48px;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
    }

    input:focus {
      border-color: var(--button-hover);
      box-shadow: 0 0 0 4px var(--focus);
      outline: 0;
    }

    button {
      border: 0;
      background: var(--button);
      color: #fff;
      cursor: pointer;
      font-weight: 750;
      padding: 0 18px;
      white-space: nowrap;
    }

    button:hover,
    button:focus {
      background: var(--button-hover);
      outline: 0;
    }

    .fine {
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0 0;
    }

    @media (max-width: 720px) {
      main {
        place-items: start center;
        padding: 14px;
      }

      .page {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .photo {
        min-height: 48vh;
        border-radius: 8px;
      }

      form {
        flex-direction: column;
        max-width: none;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="page" aria-label="The Dead Form Audit signup">
      <div class="photo" role="img" aria-label="Casual photo of Ryan"></div>

      <div class="copy">
        <p class="intro">Hi, I'm Ryan and this is:</p>
        <h1>The Dead Form Audit</h1>
        <p class="promise">A 20-min worksheet to see if your form gives sales a buyer profile - or homework.</p>
        <ul aria-label="What is included">
          <li>- score your form</li>
          <li>- find missing buyer context</li>
          <li>- see what to enrich</li>
        </ul>
        <p class="cta-line">Get it free (for now, not forever)</p>

        <form action="#" method="post" data-form="dead-form-audit">
          <input type="email" name="email" placeholder="work email" autocomplete="email" required>
          <input type="hidden" name="source" value="tslp">
          <button type="submit">Send it</button>
        </form>
        <p class="fine">No spam. Just the audit.</p>
      </div>
    </section>
  </main>

  <!-- Analytics hooks:
    - fire page_view with variant=primary
    - fire lead_submit on successful form submit
    - capture utm_source, utm_medium, utm_campaign in hidden fields before submit
  -->
</body>
</html>
