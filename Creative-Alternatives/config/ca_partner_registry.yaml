# Partner registry — the source of truth for WHO is a partner, on WHAT terms,
# and WHICH customers are attributed to them. scripts/ca_partner_gp_reconcile.py
# reads this to compute monthly payout statements.
#
# Rules (from partner-economics-2026-07-17.md):
# - Payouts compute on COLLECTED gross profit only; the script flags orders whose
#   customer has open A/R so nothing is paid on uncollected money.
# - attributed_customers use LEDGER customer names (add every spelling variant —
#   the B&H lesson). A customer can be attributed to at most ONE partner.
# - status: prospect | pilot | active | paused. Only pilot/active get statements.
# - Every entry stays "terms_approved: false" until Kenny signs the model terms.

partners: []

