        format: 3:2 landscape, minimum 1800x1200
        brief: Photograph a clear spread of real CA merchandise across apparel, bags, drinkware and one unusual item; no generic catalog collage
        alt_text_draft: A selection of branded apparel, bags, drinkware and custom merchandise produced by Creative Alternatives
        approval_gate: Products, logos and photography rights approved
      - id: product_or_process
        status: brief_ready
        candidate_assets: []
        proof_ids: []
        format: Four or five consistent 4:3 images
        brief: Capture one real example for bulk merchandise, managed stores, gifting, events and a recurring program
