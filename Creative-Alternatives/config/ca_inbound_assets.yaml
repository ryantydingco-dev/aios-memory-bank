resource_template:
  status: draft
  slots:
    - id: hero
      status: brief_ready
      candidate_assets: []
      proof_ids: []
      format: 16:9, minimum 1600x900
      brief: Create a clean editorial visual based on the resource headline and central planning concept; no customer logo, fake product proof or text-heavy poster
      alt_text_draft: Editorial planning visual for {headline}
      approval_gate: Brand treatment and resource accuracy approved
    - id: inline_tool
      status: brief_ready
      candidate_assets: []
      proof_ids: []
      format: Responsive diagram or worksheet preview, minimum 1400px wide
      brief: Turn the most useful table, calendar, checklist or decision framework into a supporting visual while preserving the full information as accessible HTML
      alt_text_draft: Visual summary of the main planning framework in {headline}
      approval_gate: Visual matches the accessible resource content exactly
    - id: social_share
      status: brief_ready
      candidate_assets: []
      proof_ids: []
      format: 1200x630
      brief: Create a branded social-share variant using the resource title and one clear planning motif
      alt_text_draft: Creative Alternatives resource, {headline}
      approval_gate: Brand treatment, title and canonical URL approved

