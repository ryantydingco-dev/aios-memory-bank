# Visual, proof, and Squarespace production control for the CA inbound system.
# Existing public material is a candidate source, not proof of reuse permission.

schema_version: "1.0.0"
updated: "2026-07-10"

guardrails:
  review_only: true
  public_actions_require_approval: true
  currently_public_does_not_equal_reuse_approved: true
  written_permission_required_for_customer_identity: true
  written_permission_required_for_people_and_minors: true
  stock_or_generated_media_cannot_be_customer_proof: true
  generated_customer_logos_are_prohibited: true
  accessible_html_cannot_be_replaced_by_text_in_images: true
  descriptive_alt_text_required: true

