schema_version: "1.0"
loop_id: partner-campaign-learning
status: waiting_for_campaign_launch
objective: Increase permissioned live merchandise opportunities generated by partner outreach.
primary_metric: live_opportunities_per_100_delivered
secondary_metrics:
  - positive_reply_rate
  - partner_fit_call_rate
  - quote_request_rate
  - collected_gross_profit
campaigns:
  creative_agency_pilot_id: 3680968
cadence: "0 16 * * 1-5"
minimum_review_unit:
  delivered_contacts: 100
  confidence: directional_only
builder:
  allowed:
    - classify_replies
    - compare_outcomes_to_tier_subsegment_and_signals
    - propose_one_change_for_next_cohort
  prohibited:
    - activate_campaign
    - send_reply
    - change_incentive_terms
verifier:
  checks:
    - delivered_denominator
    - reply_label_evidence
    - opportunity_is_permissioned_and_live
    - suppression_state
memory:
  runs_dir: outputs/loops/partner-campaign-learning/runs
  lessons: outputs/loops/partner-campaign-learning/memory.md
completion_contract:
  outcome: Each completed cohort has an evidence-backed performance report and exactly one proposed learning change.
  verification: Smartlead counts reconcile; every positive/live-opportunity label links to a source record.
  constraints: Do not treat 100 contacts as statistically conclusive; never activate or send externally.
  boundaries: Campaign 3680968, partner pipeline artifacts, and read-only CRM/channel data.
  stop_when: Campaign is unverified, not launched, data cannot reconcile, or human approval is required.
